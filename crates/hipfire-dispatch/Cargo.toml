[package]
name = "hipfire-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hip-bridge = { path = "../hip-bridge" }
hipfire-cpu = { path = "../hipfire-cpu" }
hipfire-config = { path = "../hipfire-config" }
rdna-compute = { path = "../rdna-compute" }
smallvec = "1.15.2"

[dev-dependencies]
# Worker-count determinism tests build their own pools.
rayon.workspace = true

[features]
default = []
test-utils = []
new-rotation = []
new-gemv = []
new-gemm = []
new-fused-qkv = []
new-attention = []
new-moe = []
serve-fault-inject = []
from-hip-error = []
deltanet = ["rdna-compute/deltanet"]
# Lab examples (CPU microbenchmarks); off by default.
lab = []
flash-attn-ck = ["rdna-compute/flash-attn-ck"]

[[example]]
name = "d2_cpu_arm_bench"
required-features = ["lab"]
